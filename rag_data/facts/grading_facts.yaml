# =============================================================================
# RAGreflow 事实底座 · grading_facts.yaml
# 15 个节点 = 14 个品类分册 + 1 个「跨品类通用」，与种子 CSV 的 series=D-xxx 一一对应。
# 每个节点：检测流程步骤 / 外观检测项 / 功能检测项 / 必拒清单 / 品牌分册特殊检测点。
# 数值阈值全库唯一：电池健康、走时误差、金重误差等阈值在本文件统一定义，其他文件只引用。
# =============================================================================

common_thresholds:                    # 跨品类统一阈值（品类节点只引用，不重定义）
  battery_health: {grade_S: ">=90%", grade_A: "80-89%", disclose_below: 80, reject_below: 60}
  cycle_count_note: 循环次数超过 500 次必须在报告中显著标注
  water_indicator: 进水标变色即判定进水，不论功能是否正常
  repair_history: 任何拆修史必须写入报告，隐瞒拆修即必拒
  photo_evidence_min: 6            # 每单最少取证照片张数
  video_min_seconds: 15           # 开机演示视频最短时长

# ---------------------------------------------------------------------------
手机:
  检测流程步骤:
    - 收件核验与防拆封登记（30 分钟内）
    - 外观分级拍照（正面/背面/四边/接口，共 ≥6 张）
    - 进水标检查（ SIM 槽、充电口、耳机口如有）
    - 功能逐项检测（见功能检测项）
    - 电池健康与循环次数读取
    - ID锁/账户锁退出验证
    - 出报告（签收后 48 小时内）
  外观检测项:
    - 屏幕划痕：强光侧照分级；≤2 条发丝纹且不在显示区可计 A 级
    - 边框磕碰：磕碰露底金属即降 1 级；掉漆面积 >5mm² 计 C 级
    - 背板裂纹：任何裂纹计 D 级并显著披露
    - 摄像头镜片划痕：中心区划痕降 1 级
  功能检测项:
    - 屏幕坏点/色斑/触摸断触（网格法全屏 12 区域）
    - 面容 ID/指纹解锁
    - 电池健康（S≥90%，A 80–89%，<80% 必须明示，<60% 必拒）
    - 充电口/扬声器/振动/听筒/麦克风
    - 前后摄像头对焦与闪光灯
    - 传感器（陀螺仪/指南针/距离感应）
    - ID锁/激活锁状态（必须为关闭）
  必拒清单:
    - ID锁/账户锁未退出
    - 电池健康 <60%
    - 主板维修史未申报
    - 进水标变色且功能异常
    - 机身弯曲变形（>1mm）
    - 序列号与机身/系统不一致
  品牌分册特殊检测点:
    苹果iPhone: [面容ID模组, 原彩显示, 电池循环次数, 零部件维修提示弹窗, 官换机/资源机标识]
    华为: [鸿蒙系统激活状态, 指纹模组, 荣耀拆分前型号区分]
    荣耀: [独立售后激活查询, 多屏协同]
    小米: [MIUI/HyperOS 账号解锁, 骁龙版/天玑版核对]
    Redmi: [账号锁, 屏幕原装性]
    OPPO: [ColorOS 账号, 闪充协议握手]
    vivo: [OriginOS 账号, 屏幕指纹成功率]
    三星: [Knox 熔断状态, 国行/港版/海外版鉴别]
    一加: [ OxygenOS/HydrogenOS 账号, 高刷屏档位]
    realme: [账号锁, 真我 UI 激活]
    iQOO: [vivo 账号体系, 电竞肩键]
    折叠屏专项: [铰链阻尼与异响, 折痕深度, 内屏触控分区失灵, 屏幕胶合开胶]

# ---------------------------------------------------------------------------
平板电脑:
  检测流程步骤:
    - 收件核验与防拆封登记（30 分钟内）
    - 外观分级拍照（≥6 张）
    - 进水标检查（如有）
    - 功能逐项检测
    - 电池健康读取（支持读取的型号）
    - 账户锁退出验证
    - 出报告（签收后 48 小时内）
  外观检测项:
    - 屏幕划痕/压伤（显示区分级同手机口径）
    - 边框磕碰与氧化
    - 背板弯曲（平测 >1.5mm 记录并降级）
    - 笔尖压痕（支持笔的型号检查屏幕压伤）
  功能检测项:
    - 触控全屏断触检测（网格法 16 区域）
    - WiFi/蓝牙/蜂窝（如支持）
    - 扬声器（四声道逐个）
    - 电池健康（同 common_thresholds.battery_health）
    - 手写笔与键盘配件连接（如有配件）
    - 账户锁/激活锁状态
  必拒清单:
    - 账户锁/激活锁未退出
    - 电池健康 <60%（支持读取型号）
    - 主板维修史未申报
    - 屏幕漏液扩散中
    - 序列号不一致
  品牌分册特殊检测点:
    iPad: [Apple ID 退出验证, 原彩, Apple Pencil 配对, 蜂窝版 eSIM/实体卡槽]
    华为MatePad: [鸿蒙账号, 手写笔 M-Pencil]
    小米平板: [小米账号, 键盘配件]
    荣耀平板: [荣耀账号, 多屏协同]
    三星Tab: [Samsung 账号, S Pen 压感]
    联想小新平板: [联想账号, 扩展坞接口]
    OPPO Pad: [欢太账号, 手写笔]
    vivo Pad: [vivo 账号, 手写笔]
    微软Surface: [Windows 账户退出, 触屏与支架铰链, 原装充电器验证]
    学习平板: [家长控制解除, 预装课程授权状态]
    平板笔与键盘配件: [笔尖磨损, 蓝牙连接稳定性, 键盘按键与转轴]
    安卓平板通用: [账号体系逐一确认, 系统降级风险]

# ---------------------------------------------------------------------------
笔记本电脑:
  检测流程步骤:
    - 收件核验与防拆封登记（30 分钟内）
    - 外观分级拍照（A/C/D 面各 ≥2 张）
    - 拆底盖核验（征得同意后）：硬盘/内存原装性、进水痕迹、螺丝动过痕迹
    - 功能与压力检测
    - 电池循环与健康读取
    - 账户/BIOS 锁退出验证
    - 出报告（签收后 48 小时内）
  外观检测项:
    - A 面划痕/凹陷（顶盖）
    - C 面键帽磨损与油光
    - D 面脚垫缺失与螺丝滑丝
    - 转轴阻尼与异响（开合 20 次测试）
    - 屏幕转轴区裂纹（翻转本重点）
  功能检测项:
    - 屏幕亮/坏点/亮度均匀性（纯色 5 色测试）
    - 键盘全键与触控板
    - 全接口插拔（USB/HDMI/音频/读卡器）
    - WiFi/蓝牙/摄像头/麦克风
    - 电池健康（S≥90%，A 80–89%，<80% 必须明示）与循环次数（>500 显著标注）
    - 高负载压力测试 15 分钟（CPU/GPU 温度与降频记录）
    - Windows/系统账户与 BIOS 密码退出
  必拒清单:
    - 系统/BIOS 锁未退出
    - 电池鼓包
    - 主板进水或维修史未申报
    - 屏幕漏液/大面积坏点（>5 个）
    - 配件缺失到影响开机（无电源适配器且电池报废）
  品牌分册特殊检测点:
    MacBook Air: [Apple ID 退出, T2/M 系列安全模式, 键盘连击, 电池循环]
    MacBook Pro: [Apple ID 退出, 屏幕涂层脱落(staingate), 扬声器爆音, 触控条]
    ThinkPad: [小红点, 指纹模组, 防滚架异响]
    联想小新: [联想账号, 性能模式切换]
    华为MateBook: [华为账号, 多屏协同, 触屏]
    戴尔: [SupportAssist 硬件自检, 服务标签核对]
    惠普: [HP 硬件诊断, 转轴裂纹通病]
    华硕: [华硕账号, OLED 烧屏检查]
    游戏本专项: [独显直连, 高负载烤机温度墙, 风扇异响]
    轻薄本专项: [核显性能, 便携损耗]
    二合一笔记本: [磁吸键盘触点, 触屏漂移]
    电池与循环次数专项: [循环次数读取方法, 鼓包目视与手感, 更换电池溯源]

# ---------------------------------------------------------------------------
台式机与配件:
  检测流程步骤:
    - 收件核验与登记（30 分钟内）
    - 外观拍照（配件逐件清点）
    - 通电点亮与功能测试
    - 压力测试（整机类）
    - 出报告（签收后 48 小时内）
  外观检测项:
    - 针脚弯曲（CPU/主板）
    - 金手指氧化与划痕（内存/显卡/硬盘）
    - 电容鼓包（主板/电源）
    - 风扇扇叶裂纹与异响
  功能检测项:
    - CPU：压力测试 10 分钟，主频/温度记录
    - 显卡：3D 压力测试 15 分钟，花屏/驱动崩溃记录
    - 内存：全容量与双通道识别，Memtest 1 轮
    - 硬盘：SMART 健康度与通电小时数读取
    - 电源：额定功率与接口清点
    - 显示器：坏点/亮斑/背光不均（纯色 5 色）
  必拒清单:
    - 硬盘 SMART 报警（重映射扇区超阈值）
    - 显卡花屏/虚焊史
    - CPU 针脚缺失 >2 根
    - 电源电容鼓包
    - 整机无法点亮且原因不明
  品牌分册特殊检测点:
    品牌整机: [原装配置单核对, 授权贴纸, 系统预装状态]
    DIY组装机: [配件清单逐项核验, 装机质量（理线/硅脂）]
    CPU: [步进与盒装散装核对, 超频史痕迹]
    显卡: [核心硅脂更换史, 显存测试, 挖矿痕迹]
    主板: [BIOS 版本与解锁, 接口氧化]
    内存: [颗粒品牌与条数核对, 超频稳定性]
    硬盘: [机械盘异响, 固态写入量, 数据销毁确认]
    显示器: [漏光分级, 亮度均匀性, 接口功能]
    机械键盘: [轴体手感逐键, 灯光, 连击]
    电源: [输出电压稳定性, 噪音]
    散热: [热管直触平整度, 扣具齐全]
    整机老化测试: [连续运行 4 小时稳定性]

# ---------------------------------------------------------------------------
相机与镜头:
  检测流程步骤:
    - 收件核验与登记（30 分钟内）
    - 外观分级拍照（机身/镜头/屏幕 ≥6 张）
    - 快门数读取（支持机型）
    - 功能逐项检测
    - 镜头透光检查（强光手电）
    - 出报告（签收后 48 小时内）
  外观检测项:
    - 机身蒙皮脱胶与磨损
    - 快门按键与转盘行程
    - 热靴氧化
    - 镜头镜片划痕/霉斑/进灰（强光分级）
    - 镜筒变焦/对焦环阻尼
  功能检测项:
    - 快门数读取（S≤5 万张优先，>10 万张显著标注）
    - 传感器坏点/灰尘（小光圈拍白墙）
    - 对焦精度（中央/边缘，视频跟焦）
    - 防抖功能
    - 取景器与 LCD 显示
    - 全接口与卡槽读写
    - 镜头：对焦马达异响、光圈叶片收缩、变焦滑头
  必拒清单:
    - 传感器大面积坏点（>10 个）
    - 镜头内部霉斑侵入镀膜层
    - 机身进水/摔机史未申报
    - 快门报错或连拍卡死
    - 翻新机当原装机出售
  品牌分册特殊检测点:
    佳能机身: [快门数读取, 反光板异响, EF/RF 卡口磨损]
    尼康机身: [快门数读取, 光圈拨杆]
    索尼机身: [快门数（菜单或工具读取）, 机身发热, 菜单按键摇杆]
    富士机身: [胶片模拟输出校验, 旁轴视差]
    微单与单反区别: [取景方式差异说明, 清洁 SENSOR 流程]
    镜头霉斑与进灰: [霉斑分级（点状/丝状/侵入）, 除霉可行性]
    快门次数查验: [各品牌读取方法汇总]
    镜头对焦检测: [跑焦测试方法, 呼吸效应]
    闪光灯与配件: [闪光指数实测, 引闪同步]
    摄像机: [磁带/存储卡双轨记录, 变焦杆]
    运动相机: [防水仓密封, 防抖实测, 过热断录]
    CCD相机: [传感器坏点（时移噪点）, 日期电池仓腐蚀]

# ---------------------------------------------------------------------------
智能手表与穿戴:
  检测流程步骤:
    - 收件核验与登记（30 分钟内）
    - 外观拍照（表体/表带/表扣 ≥6 张）
    - 配对锁解除验证
    - 功能逐项检测
    - 电池健康读取（支持机型）
    - 出报告（签收后 48 小时内）
  外观检测项:
    - 表镜划痕与碎裂
    - 表壳磕碰与镀层脱落
    - 表带拉伸老化与异味
    - 充电触点氧化
  功能检测项:
    - 心率/血氧/ECG（与标准设备对比误差记录）
    - GPS 定位
    - 蓝牙连接与通话
    - 防水密封（外观检查与说明书口径核对，不做破坏性水测）
    - 电池健康（同 common_thresholds.battery_health）
    - 配对锁/激活锁（必须解除）
  必拒清单:
    - 配对锁/激活锁未解除
    - 电池鼓包
    - 表镜碎裂影响显示
    - 蜂窝版未解除运营商锁（如有）
    - 传感器模组失效
  品牌分册特殊检测点:
    Apple Watch: [Apple ID 激活锁, 表冠转动, 防水胶圈老化]
    华为手表: [华为账号, 表盘商店授权]
    小米手环与手表: [小米账号, 腕带卡扣]
    荣耀手表: [荣耀账号]
    三星手表: [Samsung 账号, Tizen/WearOS 版本]
    Garmin: [Connect 账号解绑, 光学心率窗划痕]
    表带与表壳检测: [生耳松动, 表扣开合力]
    电池健康检测: [各品牌读取路径汇总]
    ECG与血氧功能: [区域授权差异, 电极片清洁]
    防水密封检测: [密封圈状态, 非破坏性检测口径]
    蜂窝版与GPS版: [eSIM 注销状态, 型号核对]
    配对锁查验: [各品牌解除流程]

# ---------------------------------------------------------------------------
游戏主机与游戏:
  检测流程步骤:
    - 收件核验与登记（30 分钟内）
    - 外观拍照（主机/手柄/配件逐件）
    - Ban 机状态核验（在线联网验证）
    - 功能逐项检测
    - 光驱/卡带槽读写测试
    - 出报告（签收后 48 小时内）
  外观检测项:
    - 外壳划痕与泛黄
    - 接口氧化与松脱
    - 散热口积灰与拆机痕迹（贴纸破损）
    - 手柄按键磨损与摇杆漂移
  功能检测项:
    - 开机自检与系统版本
    - Ban 机查验（在线状态、多人功能）
    - 光驱读盘（光盘版）/卡槽读写（卡带版）
    - 手柄全按键、摇杆漂移（静置 5 秒位移记录）、震动
    - HDMI 输出与音频
    - 硬盘容量与扩容史
  必拒清单:
    - Ban 机（在线功能永久封禁）未申报
    - 破解/改装机当原装机出售
    - 摇杆漂移超阈值（静置位移持续 >2%）未披露
    - 光驱无法读盘
    - 配件缺失到无法开机（无电源线）
  品牌分册特殊检测点:
    PS5: [光驱版/数字版核对, 待机呼吸灯, 可拆卸光驱座]
    PS4: [光驱与硬盘双仓, 风扇噪音]
    Switch: [Joy-Con 漂移通病, 底座 HDMI, 序列号 Ban 机库比对]
    Xbox: [手柄固件, Game Pass 账号剥离提醒]
    Steam Deck: [屏幕漏光, 风扇异响, 系统恢复盘]
    复古掌机: [电池仓腐蚀, 屏幕老化]
    游戏手柄: [各平台兼容性, 扳机线性]
    卡带与光盘: [卡带金手指氧化, 光盘划痕与读盘测试]
    账号与数字版: [数字版游戏授权与账号绑定说明]
    Ban机查验: [各主机 Ban 机判定口径]
    手柄漂移检测: [标准化的摇杆静置测试流程]
    主机散热与维修史: [硅脂更换痕迹, 螺丝滑丝]

# ---------------------------------------------------------------------------
奢侈品箱包:
  检测流程步骤:
    - 收件核验与登记（30 分钟内，全程录像）
    - 外观分级拍照（≥8 张，含五金特写）
    - 身份卡/序列号/镭射标核验
