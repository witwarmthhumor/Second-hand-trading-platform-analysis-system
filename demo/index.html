  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {

    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.6;
  }
  .app { max-width: 1080px; margin: 0 auto; padding: 24px 20px 60px; }

  /* 顶部 */
  .header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 20px;
  }
  .header h1 { font-size: 20px; font-weight: 700; }
  .header .sub { color: var(--text-sub); font-size: 12px; margin-top: 2px; }

  /* 导航 Tab */
  .tabs { display: flex; gap: 8px; margin-bottom: 20px; border-bottom: 1px solid var(--border); }
  .tab {
    padding: 10px 18px; cursor: pointer; border: none; background: none;
    font-size: 14px; color: var(--text-sub); border-bottom: 2px solid transparent;
    transition: all .15s; display: flex; align-items: center; gap: 6px;
  }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: 600; }
  .tab .badge {
    background: var(--primary); color: #fff; font-size: 11px;
    border-radius: 10px; padding: 0 7px; line-height: 18px; min-width: 18px; text-align: center;
  }

  /* 通用面板 */
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow); }
  .toolbar { display: flex; gap: 10px; align-items: center; padding: 14px 16px; flex-wrap: wrap; }

  input, select, textarea {
    padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px;
    font-size: 14px; font-family: inherit; outline: none; background: #fff;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--primary); }

  .btn {
    padding: 8px 16px; border: 1px solid var(--border); border-radius: 8px;
    background: #fff; cursor: pointer; font-size: 14px; transition: all .15s;
  }
  .btn:hover { border-color: var(--primary); color: var(--primary); }
  .btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }
  .btn-primary:hover { background: var(--primary-hover); color: #fff; }
  .btn-danger { color: var(--danger); }
  .btn-danger:hover { border-color: var(--danger); }
  .btn-sm { padding: 4px 10px; font-size: 13px; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }

  /* 列表页 */
  .list-wrap { padding: 6px 16px 16px; }
  .count-tip { color: var(--text-sub); font-size: 12px; padding: 0 16px 8px; }
  .card {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 14px 16px; border-bottom: 1px solid var(--border);
  }
  .card:last-child { border-bottom: none; }
  .card .check { margin-top: 3px; }
  .card-body { flex: 1; min-width: 0; }
  .card-title { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .card-title .name { font-weight: 600; font-size: 15px; }
  .tag {
    font-size: 12px; padding: 1px 8px; border-radius: 4px;
    background: #eef2ff; color: #4338ca; white-space: nowrap;
  }
  .tag.status-online { background: #ecfdf5; color: var(--success); }
  .tag.status-offline { background: #f3f4f6; color: var(--text-sub); }
  .tag.status-dev { background: #fffbeb; color: var(--warn); }
  .card-desc { color: var(--text-sub); font-size: 13px; margin-top: 4px; }
  .card-meta { margin-top: 6px; font-size: 12px; color: var(--text-sub); display: flex; gap: 12px; flex-wrap: wrap; }
  .card-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .empty { text-align: center; padding: 40px; color: var(--text-sub); }

  /* 表单 */
  .form { padding: 20px 16px; }
  .form-section { margin-bottom: 20px; }
  .form-section h3 { font-size: 14px; margin-bottom: 12px; padding-left: 8px; border-left: 3px solid var(--primary); }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 20px; }
  .form-item { display: flex; flex-direction: column; gap: 5px; }
  .form-item.full { grid-column: 1 / -1; }
  .form-item label { font-size: 13px; color: var(--text-sub); }
  .form-item label .req { color: var(--danger); }
  .form-item .err { color: var(--danger); font-size: 12px; display: none; }
  .form-item.invalid input, .form-item.invalid select { border-color: var(--danger); }
  .form-item.invalid .err { display: block; }
  .form-actions { display: flex; gap: 10px; padding-top: 4px; }

  /* 对比页 */
  .compare-empty { padding: 60px 20px; text-align: center; color: var(--text-sub); }
  .compare-head { padding: 16px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
  .compare-head .sel { color: var(--text-sub); font-size: 13px; }
  .compare-body { padding: 0 16px 20px; }
  .compare-body h3 { font-size: 14px; margin: 18px 0 10px; }
  table.cmp { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.cmp th, table.cmp td { border: 1px solid var(--border); padding: 9px 12px; text-align: left; vertical-align: top; }
  table.cmp thead th { background: #f9fafb; font-weight: 600; }
  table.cmp td.dim { background: #f9fafb; font-weight: 600; white-space: nowrap; width: 110px; color: var(--text-sub); }
  .radar-box { display: flex; justify-content: center; padding: 10px 0; overflow-x: auto; }
  .legend { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; margin-top: 8px; font-size: 12px; color: var(--text-sub); }
  .legend span { display: flex; align-items: center; gap: 5px; }
  .legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }

  .toast {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
    background: #111827; color: #fff; padding: 10px 20px; border-radius: 8px;
    font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 999;
  }
  .toast.show { opacity: 1; }
</style>

      pricing: '按枚收费', strengths: '评级标准专业、封装权威',
      weaknesses: '周期长、费用高', tags: ['评级', '钱币', '专业'],
      remark: '', score: { 功能: 4, 用户量: 2, 鉴定: 5, 价格: 2, 口碑: 4 }
    },
    {
      id: 6, name: '古泉园地', type: '社区', positioning: '古钱币收藏交流与交易的垂直社区',
      website: 'https://example.com', status: '已上线',
      features: '钱币交易、鉴定讨论、拍卖、知识分享',
      targetUsers: '古钱币爱好者', businessModel: '交易佣金 + 会员',
      pricing: '免费 + 会员', strengths: '古钱币领域专业度高',
      weaknesses: '规模较小、用户量有限', tags: ['社区', '古钱币', '垂直'],
      remark: '', score: { 功能: 3, 用户量: 2, 鉴定: 4, 价格: 4, 口碑: 4 }
    }
  ];

  let selectedIds = new Set();
  let nextId = 100;
  let editingId = null;

  // ===== 工具 =====
  const $ = (s) => document.querySelector(s);
  const $$ = (s) => document.querySelectorAll(s);

  function toast(msg) {
    const t = $('#toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(() => t.classList.remove('show'), 1800);
  }

  function switchTab(tab) {
    $$('.tab').forEach(el => el.classList.toggle('active', el.dataset.tab === tab));
    ['list', 'form', 'compare'].forEach(v => {
      $('#view-' + v).style.display = (v === tab) ? '' : 'none';
    });
    if (tab === 'list') renderList();
    if (tab === 'compare') renderCompare();
  }

  // ===== 列表页 =====
  function renderList() {
    const kw = $('#searchInput').value.trim().toLowerCase();
    const type = $('#typeFilter').value;
    const list = competitors.filter(c => {
      if (type && c.type !== type) return false;
      if (kw) {
        const hay = (c.name + ' ' + c.positioning + ' ' + c.tags.join(' ') + ' ' + c.features).toLowerCase();
        if (!hay.includes(kw)) return false;
      }
      return true;
    });

    $('#countTip').textContent = `共 ${list.length} 条竞品`;
    const container = $('#listContainer');
    if (list.length === 0) {
      container.innerHTML = '<div class="empty">暂无匹配的竞品</div>';
      return;
    }
    container.innerHTML = list.map(c => {
      const statusCls = c.status === '已上线' ? 'status-online' : (c.status === '内测' ? 'status-dev' : 'status-offline');
      return `
        <div class="card">
          <input type="checkbox" class="check" data-id="${c.id}" ${selectedIds.has(c.id) ? 'checked' : ''}>
          <div class="card-body">
            <div class="card-title">
              <span class="name">${c.name}</span>
              <span class="tag">${c.type}</span>
              <span class="tag ${statusCls}">${c.status}</span>
            </div>
            <div class="card-desc">${c.positioning}</div>
            <div class="card-meta">
              ${c.tags.map(t => `<span class="tag">${t}</span>`).join('')}
              <span>官网：${c.website || '—'}</span>
            </div>
          </div>
          <div class="card-actions">
            <button class="btn btn-sm" data-edit="${c.id}">编辑</button>
            <button class="btn btn-sm btn-danger" data-del="${c.id}">删除</button>
          </div>
        </div>`;
    }).join('');

    // 事件绑定
    container.querySelectorAll('.check').forEach(cb => {
      cb.addEventListener('change', (e) => {
        const id = Number(e.target.dataset.id);
        if (e.target.checked) selectedIds.add(id); else selectedIds.delete(id);
        updateCompareBadge();
      });
    });
    container.querySelectorAll('[data-edit]').forEach(btn => {
      btn.addEventListener('click', () => startEdit(Number(btn.dataset.edit)));
    });
    container.querySelectorAll('[data-del]').forEach(btn => {
      btn.addEventListener('click', () => delCompetitor(Number(btn.dataset.del)));
    });
  }

  function updateCompareBadge() {
    $('#compareBadge').textContent = selectedIds.size;
  }

  function delCompetitor(id) {
    if (!confirm('确认删除该竞品？')) return;
    competitors = competitors.filter(c => c.id !== id);
    selectedIds.delete(id);
    updateCompareBadge();
    renderList();
    toast('已删除');
  }

  // ===== 录入 / 编辑 =====
  function startEdit(id) {
    const c = competitors.find(x => x.id === id);
    if (!c) return;
    editingId = id;
    const f = $('#competitorForm');
    f.elements['name'].value = c.name;
    f.elements['type'].value = c.type;
    f.elements['positioning'].value = c.positioning;
    f.elements['website'].value = c.website;
    f.elements['status'].value = c.status;
    f.elements['features'].value = c.features;
    f.elements['targetUsers'].value = c.targetUsers;
    f.elements['businessModel'].value = c.businessModel;
    f.elements['pricing'].value = c.pricing;
    f.elements['strengths'].value = c.strengths;
    f.elements['weaknesses'].value = c.weaknesses;
    f.elements['tags'].value = c.tags.join(',');
    f.elements['remark'].value = c.remark;
    switchTab('form');
    toast('正在编辑：' + c.name);
  }

  function resetForm() {
    editingId = null;
    $('#competitorForm').reset();
    $$('.form-item').forEach(el => el.classList.remove('invalid'));
  }

  function submitForm(e) {
    e.preventDefault();
    const f = e.target;
    let ok = true;
    // 校验必填
    ['name', 'type'].forEach(field => {
      const wrap = document.querySelector(`.form-item[data-field="${field}"]`);
      const val = f.elements[field].value.trim();
      if (!val) { wrap.classList.add('invalid'); ok = false; }
      else wrap.classList.remove('invalid');
    });
    if (!ok) { toast('请填写必填项'); return; }

    const data = {
      name: f.elements['name'].value.trim(),
      type: f.elements['type'].value,
      positioning: f.elements['positioning'].value.trim(),
      website: f.elements['website'].value.trim(),
      status: f.elements['status'].value,
      features: f.elements['features'].value.trim(),
      targetUsers: f.elements['targetUsers'].value.trim(),
      businessModel: f.elements['businessModel'].value.trim(),
      pricing: f.elements['pricing'].value.trim(),
      strengths: f.elements['strengths'].value.trim(),
      weaknesses: f.elements['weaknesses'].value.trim(),
      tags: f.elements['tags'].value.split(/[,，]/).map(s => s.trim()).filter(Boolean),
      remark: f.elements['remark'].value.trim(),
      score: { 功能: 3, 用户量: 3, 鉴定: 3, 价格: 3, 口碑: 3 }
    };

    if (editingId) {
      const idx = competitors.findIndex(x => x.id === editingId);
      competitors[idx] = { ...competitors[idx], ...data };
      toast('已更新');
    } else {
      competitors.push({ id: nextId++, ...data });
      toast('已保存，可在列表中查看');
    }
    resetForm();
    switchTab('list');
  }

  // ===== 对比页 =====
  const DIMENSIONS = [
    { key: 'name', label: '名称' },
    { key: 'type', label: '平台类型' },
    { key: 'positioning', label: '定位' },
    { key: 'status', label: '上线状态' },
    { key: 'targetUsers', label: '目标用户' },
    { key: 'businessModel', label: '业务模式' },
    { key: 'pricing', label: '定价方式' },
    { key: 'strengths', label: '优势' },
    { key: 'weaknesses', label: '不足' },
    { key: 'features', label: '核心功能' }
  ];
  const RADAR_DIMS = ['功能', '用户量', '鉴定', '价格', '口碑'];
  const RADAR_COLORS = ['#2563eb', '#dc2626', '#16a34a', '#d97706', '#7c3aed', '#0891b2'];

  function renderCompare() {
    const panel = $('#comparePanel');
    const sel = competitors.filter(c => selectedIds.has(c.id));

    if (sel.length < 2) {
      panel.innerHTML = `
        <div class="compare-empty">
          <p style="font-size:16px;margin-bottom:8px;">${sel.length === 0 ? '还没有选择竞品' : '已选 ' + sel.length + ' 个，至少需要 2 个才能对比'}</p>
          <p style="font-size:13px;">去列表页勾选至少 2 个竞品后再来对比</p>
          <button class="btn btn-primary" style="margin-top:16px;" id="goListEmpty">去选择竞品</button>
        </div>`;
      panel.querySelector('#goListEmpty').addEventListener('click', () => switchTab('list'));
      return;
    }

    const cols = sel.map((c, i) => ({ c, color: RADAR_COLORS[i % RADAR_COLORS.length] }));
    const tableRows = DIMENSIONS.map(d => {
      const cells = cols.map(({ c }) => `<td>${escapeHtml(String(c[d.key] || '—'))}</td>`).join('');
      return `<tr><td class="dim">${d.label}</td>${cells}</tr>`;
    }).join('');

    panel.innerHTML = `
      <div class="compare-head">
        <div class="sel">已选择 <b>${sel.length}</b> 个竞品进行对比</div>
        <div style="display:flex;gap:8px;">
          <button class="btn" id="backToListBtn">继续选择</button>
          <button class="btn btn-danger" id="clearSelBtn">清空选择</button>
        </div>
      </div>
      <div class="compare-body">
        <h3>雷达图对比</h3>
        <div class="radar-box">${buildRadar(cols)}</div>
        <div class="legend">${cols.map(({c,color}) => `<span><i style="background:${color}"></i>${escapeHtml(c.name)}</span>`).join('')}</div>
        <h3>详细对比表</h3>
        <table class="cmp">
          <thead><tr><th>维度</th>${cols.map(({c}) => `<th>${escapeHtml(c.name)}</th>`).join('')}</tr></thead>
          <tbody>${tableRows}</tbody>
        </table>
      </div>`;

    panel.querySelector('#backToListBtn').addEventListener('click', () => switchTab('list'));
    panel.querySelector('#clearSelBtn').addEventListener('click', () => {
      selectedIds.clear();
      updateCompareBadge();
      renderCompare();
      toast('已清空选择');
    });
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  }

  // 手绘 SVG 雷达图
  function buildRadar(cols) {
    const n = RADAR_DIMS.length;
    const cx = 180, cy = 170, R = 130;
    const angle = (i) => -Math.PI / 2 + (i * 2 * Math.PI / n);
    const pt = (i, r) => [cx + r * Math.cos(angle(i)), cy + r * Math.sin(angle(i))];

    // 网格
    let grid = '';
    for (let level = 1; level <= 5; level++) {
      const r = R * level / 5;
      const pts = RADAR_DIMS.map((_, i) => pt(i, r).join(',')).join(' ');
      grid += `<polygon points="${pts}" fill="none" stroke="#e5e7eb" stroke-width="1"/>`;
    }
    // 轴线
    let axes = RADAR_DIMS.map((_, i) => {
      const [x, y] = pt(i, R);
      return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#e5e7eb" stroke-width="1"/>`;
    }).join('');

    // 维度标签
    let labels = RADAR_DIMS.map((d, i) => {
      const [x, y] = pt(i, R + 22);
      const anchor = Math.abs(x - cx) < 5 ? 'middle' : (x > cx ? 'start' : 'end');
      return `<text x="${x}" y="${y + 4}" text-anchor="${anchor}" font-size="12" fill="#6b7280">${d}</text>`;
    }).join('');

    // 数据多边形
    let polys = cols.map(({ c, color }) => {
      const pts = RADAR_DIMS.map((d, i) => pt(i, R * (c.score[d] || 0) / 5).join(',')).join(' ');
      return `<polygon points="${pts}" fill="${color}" fill-opacity="0.15" stroke="${color}" stroke-width="2"/>`;
    }).join('');

    return `<svg width="360" height="340" viewBox="0 0 360 340" xmlns="http://www.w3.org/2000/svg">${grid}${axes}${labels}${polys}</svg>`;
  }

  // ===== 事件绑定 =====
  $$('.tab').forEach(t => t.addEventListener('click', () => switchTab(t.dataset.tab)));
  $('#searchInput').addEventListener('input', renderList);
  $('#typeFilter').addEventListener('change', renderList);
  $('#goFormBtn').addEventListener('click', () => { resetForm(); switchTab('form'); });
  $('#cancelFormBtn').addEventListener('click', () => { resetForm(); switchTab('list'); });
  $('#competitorForm').addEventListener('submit', submitForm);

  // 初始化
  updateCompareBadge();
  renderList();
</script>
</body>
</html>
