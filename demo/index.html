<title>二手交易平台分析系统 — Demo</title>
<style>
  :root {
    --bg: #f5f6f8;
    --panel: #ffffff;
    --border: #e5e7eb;
    --text: #1f2937;
    --text-sub: #6b7280;
    --primary: #2563eb;
    --primary-hover: #1d4ed8;
    --danger: #dc2626;
    --success: #16a34a;
    --warn: #d97706;
    --shadow: 0 1px 3px rgba(0,0,0,.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.6;
  }
  .app { max-width: 1080px; margin: 0 auto; padding: 24px 20px 60px; }

  /* 顶部 */
  .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  .header h1 { font-size: 20px; font-weight: 700; }
  .header .sub { color: var(--text-sub); font-size: 12px; margin-top: 2px; }

  /* 导航 Tab */
  .tabs { display: flex; gap: 8px; margin-bottom: 20px; border-bottom: 1px solid var(--border); }
  .tab {
    padding: 10px 18px; cursor: pointer; border: none; background: none;
    font-size: 14px; color: var(--text-sub); border-bottom: 2px solid transparent;
    transition: all .15s; display: flex; align-items: center; gap: 6px;
  }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: 600; }
  .tab .badge {
    background: var(--primary); color: #fff; font-size: 11px;
    border-radius: 10px; padding: 0 7px; line-height: 18px; min-width: 18px; text-align: center;
  }

  /* 通用面板 */
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow); }
  .toolbar { display: flex; gap: 10px; align-items: center; padding: 14px 16px; flex-wrap: wrap; }

  input, select, textarea {
    padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px;
    font-size: 14px; font-family: inherit; outline: none; background: #fff;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--primary); }

  .btn {
    padding: 8px 16px; border: 1px solid var(--border); border-radius: 8px;
    background: #fff; cursor: pointer; font-size: 14px; transition: all .15s;
  }
  .btn:hover { border-color: var(--primary); color: var(--primary); }
  .btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }
  .btn-primary:hover { background: var(--primary-hover); color: #fff; }
  .btn-danger { color: var(--danger); }
  .btn-danger:hover { border-color: var(--danger); }
  .btn-sm { padding: 4px 10px; font-size: 13px; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }

  /* 列表页 */
  .list-wrap { padding: 6px 16px 16px; }
  .count-tip { color: var(--text-sub); font-size: 12px; padding: 0 16px 8px; }
  .card {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 14px 16px; border-bottom: 1px solid var(--border);
  }
  .card:last-child { border-bottom: none; }
  .card .check { margin-top: 3px; }
  .card-body { flex: 1; min-width: 0; }
  .card-title { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .card-title .name { font-weight: 600; font-size: 15px; }
  .tag {
    font-size: 12px; padding: 1px 8px; border-radius: 4px;
    background: #eef2ff; color: #4338ca; white-space: nowrap;
  }
  .tag.status-online { background: #ecfdf5; color: var(--success); }
  .tag.status-offline { background: #f3f4f6; color: var(--text-sub); }
  .tag.status-dev { background: #fffbeb; color: var(--warn); }
  .card-desc { color: var(--text-sub); font-size: 13px; margin-top: 4px; }
  .card-meta { margin-top: 6px; font-size: 12px; color: var(--text-sub); display: flex; gap: 12px; flex-wrap: wrap; }
  .card-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .empty { text-align: center; padding: 40px; color: var(--text-sub); }

  /* 表单 */
  .form { padding: 20px 16px; }
  .form-section { margin-bottom: 20px; }
  .form-section h3 { font-size: 14px; margin-bottom: 12px; padding-left: 8px; border-left: 3px solid var(--primary); }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 20px; }
  .form-item { display: flex; flex-direction: column; gap: 5px; }
  .form-item.full { grid-column: 1 / -1; }
  .form-item label { font-size: 13px; color: var(--text-sub); }
  .form-item label .req { color: var(--danger); }
  .form-item .err { color: var(--danger); font-size: 12px; display: none; }
  .form-item.invalid input, .form-item.invalid select { border-color: var(--danger); }
  .form-item.invalid .err { display: block; }
  .form-actions { display: flex; gap: 10px; padding-top: 4px; }

  /* 评分条 */
  .score-row { display: flex; align-items: center; gap: 10px; }
  .score-row label { width: 90px; font-size: 13px; color: var(--text-sub); }
  .score-row input[type=range] { flex: 1; }
  .score-row .score-val { width: 28px; text-align: center; font-weight: 600; color: var(--primary); }

  /* 对比页 */
  .compare-empty { padding: 60px 20px; text-align: center; color: var(--text-sub); }
  .compare-head { padding: 16px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
  .compare-head .sel { color: var(--text-sub); font-size: 13px; }
  .compare-body { padding: 0 16px 20px; }
  .compare-body h3 { font-size: 14px; margin: 18px 0 10px; }
  table.cmp { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.cmp th, table.cmp td { border: 1px solid var(--border); padding: 9px 12px; text-align: left; vertical-align: top; }
  table.cmp thead th { background: #f9fafb; font-weight: 600; }
  table.cmp td.dim { background: #f9fafb; font-weight: 600; white-space: nowrap; width: 110px; color: var(--text-sub); }
  .radar-box { display: flex; justify-content: center; padding: 10px 0; overflow-x: auto; }
  .legend { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; margin-top: 8px; font-size: 12px; color: var(--text-sub); }
  .legend span { display: flex; align-items: center; gap: 5px; }
  .legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }

  /* 问答页 */
  .qa-layout { display: flex; flex-direction: column; gap: 16px; }
  .qa-chat { display: flex; flex-direction: column; gap: 14px; padding: 16px; min-height: 320px; max-height: 480px; overflow-y: auto; }
  .qa-msg { display: flex; gap: 10px; max-width: 88%; }
  .qa-msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .qa-msg .bubble {
    padding: 10px 14px; border-radius: 10px; background: #f3f4f6; font-size: 14px; line-height: 1.6;
  }
  .qa-msg.user .bubble { background: var(--primary); color: #fff; }
  .qa-msg.assistant .bubble { background: #fff; border: 1px solid var(--border); }
  .qa-msg .avatar {
    width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; color: #fff;
  }
  .qa-msg.user .avatar { background: var(--primary); }
  .qa-msg.assistant .avatar { background: #10b981; }
  .qa-src { margin-top: 8px; padding: 8px 10px; background: #f9fafb; border-left: 3px solid #10b981; border-radius: 4px; font-size: 12px; color: var(--text-sub); }
  .qa-src .src-title { font-weight: 600; color: var(--text); margin-bottom: 2px; }
  .qa-input { display: flex; gap: 10px; padding: 14px 16px; border-top: 1px solid var(--border); }
  .qa-input input { flex: 1; }
  .qa-hints { padding: 12px 16px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .qa-hints .hint-label { font-size: 12px; color: var(--text-sub); }
  .qa-hints .hint {
    font-size: 12px; padding: 4px 10px; border: 1px solid var(--border); border-radius: 14px;
    background: #fff; cursor: pointer; color: var(--text-sub); transition: all .15s;
  }
  .qa-hints .hint:hover { border-color: var(--primary); color: var(--primary); }
  .qa-typing { display: flex; gap: 6px; align-items: center; color: var(--text-sub); font-size: 13px; padding: 8px 4px; }
  .qa-typing .dot { width: 6px; height: 6px; border-radius: 50%; background: #9ca3af; animation: blink 1.2s infinite; }
  .qa-typing .dot:nth-child(2) { animation-delay: .2s; }
  .qa-typing .dot:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%,100% { opacity: .2; } 50% { opacity: 1; } }

  .toast {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
    background: #111827; color: #fff; padding: 10px 20px; border-radius: 8px;
    font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 999;
  }
  .toast.show { opacity: 1; }
</style>
</head>

  // ===== 列表页 =====
  function renderList() {
    const kw = $('#searchInput').value.trim().toLowerCase();

              <span class="tag">${c.type}</span>

            </div>

  function updateCompareBadge() {

  function delCompetitor(id) {

  // ===== 录入 / 编辑 =====
  function renderScoreArea(scores) {

    area.innerHTML = RATING_DIMS.map(d => {

      return `
        <div class="form-item">

            <label>${d}</label>

    }).join('');

      r.addEventListener('input', (e) => {
        e.target.closest('.score-row').querySelector('.score-val').textContent = e.target.value;
      });
    });

  function startEdit(id) {

    editingId = id;

    f.elements['name'].value = c.name;
    f.elements['type'].value = c.type;
    f.elements['positioning'].value = c.positioning;
    f.elements['website'].value = c.website;
    f.elements['status'].value = c.status;
    f.elements['features'].value = c.features;
    f.elements['targetUsers'].value = c.targetUsers;
    f.elements['businessModel'].value = c.businessModel;
    f.elements['pricing'].value = c.pricing;
    f.elements['strengths'].value = c.strengths;
    f.elements['weaknesses'].value = c.weaknesses;
    f.elements['tags'].value = c.tags.join(',');

    editingId = null;
    $('#competitorForm').reset();

    $$('.form-item').forEach(el => el.classList.remove('invalid'));
  }

    const f = e.target;

    ['name', 'type'].forEach(field => {
      const wrap = document.querySelector(`.form-item[data-field="${field}"]`);
      const val = f.elements[field].value.trim();
      if (!val) { wrap.classList.add('invalid'); ok = false; }
      else wrap.classList.remove('invalid');

    const data = {

      features: f.elements['features'].value.trim(),

  // ===== 对比页 =====
  const DIMENSIONS = [
    { key: 'name', label: '名称' },
    { key: 'type', label: '平台类型' },

    { key: 'status', label: '上线状态' },

  function renderCompare() {
    const panel = $('#comparePanel');

          <thead><tr><th>竞品</th>${cols.map(({c}) => `<th>${escapeHtml(c.name)}</th>`).join('')}</tr></thead>

          <thead><tr><th>维度</th>${cols.map(({c}) => `<th>${escapeHtml(c.name)}</th>`).join('')}</tr></thead>
          <tbody>${tableRows}</tbody>
        </table>

    panel.querySelector('#backToListBtn').addEventListener('click', () => switchTab('list'));

      selectedIds.clear();
      updateCompareBadge();
      renderCompare();
      toast('已清空选择');
    });
  }

  // 手绘 SVG 雷达图
  function buildRadar(cols) {
    const n = RATING_DIMS.length;
    const cx = 180, cy = 170, R = 130;
    const angle = (i) => -Math.PI / 2 + (i * 2 * Math.PI / n);
    const pt = (i, r) => [cx + r * Math.cos(angle(i)), cy + r * Math.sin(angle(i))];

    let grid = '';
    for (let level = 1; level <= 5; level++) {
      const r = R * level / 5;
      const pts = RATING_DIMS.map((_, i) => pt(i, r).join(',')).join(' ');
      grid += `<polygon points="${pts}" fill="none" stroke="#e5e7eb" stroke-width="1"/>`;
    }
    let axes = RATING_DIMS.map((_, i) => {
      const [x, y] = pt(i, R);
      return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#e5e7eb" stroke-width="1"/>`;
    }).join('');

    let labels = RATING_DIMS.map((d, i) => {
      const [x, y] = pt(i, R + 26);
      const anchor = Math.abs(x - cx) < 5 ? 'middle' : (x > cx ? 'start' : 'end');
      return `<text x="${x}" y="${y + 4}" text-anchor="${anchor}" font-size="12" fill="#6b7280">${d}</text>`;
    }).join('');

    let polys = cols.map(({ c, color }) => {
      const pts = RATING_DIMS.map((d, i) => pt(i, R * (c.score[d] || 0) / 5).join(',')).join(' ');
      return `<polygon points="${pts}" fill="${color}" fill-opacity="0.15" stroke="${color}" stroke-width="2"/>`;
    }).join('');

    return `<svg width="360" height="340" viewBox="0 0 360 340" xmlns="http://www.w3.org/2000/svg">${grid}${axes}${labels}${polys}</svg>`;
  }

  // ===== 知识库问答 =====
  let qaInited = false;
  function initQa() {
    if (qaInited) return;
    qaInited = true;
    // 欢迎语
    appendQa('assistant', '你好，我是基于二手交易知识库的问答助手。你可以问我关于闲鱼、转转、爱回收等平台的交易规则、验机服务、回收政策等问题。', null);
    $('#qaSendBtn').addEventListener('click', askQa);
    $('#qaInput').addEventListener('keyup', (e) => { if (e.key === 'Enter') askQa(); });
    $$('.qa-hints .hint').forEach(h => {
      h.addEventListener('click', () => { $('#qaInput').value = h.textContent; askQa(); });
    });
  }

  function appendQa(role, text, src) {
    const chat = $('#qaChat');
    const wrap = document.createElement('div');
    wrap.className = 'qa-msg ' + role;
    const avatar = role === 'user' ? '我' : 'AI';
    let srcHtml = '';
    if (src) {
      srcHtml = `<div class="qa-src"><div class="src-title">📄 来源：${escapeHtml(src.title)}</div><div>${escapeHtml(src.text)}</div></div>`;
    }
    wrap.innerHTML = `<div class="avatar">${avatar}</div><div class="bubble">${escapeHtml(text)}${srcHtml}</div>`;
    chat.appendChild(wrap);
    chat.scrollTop = chat.scrollHeight;
  }

  // mock 检索：简单关键词匹配，模拟 RAG 命中
  function mockRetrieve(question) {
    const q = question;
    // 关键词命中打分
    const scored = KB_DOCS.map(doc => {
      let score = 0;
      const ql = q;
      if (ql.includes('闲鱼') && doc.title.includes('闲鱼')) score += 3;
      if (ql.includes('转转') && doc.title.includes('转转')) score += 3;
      if (ql.includes('爱回收') && doc.title.includes('爱回收')) score += 3;
      if (ql.includes('退货') && (doc.text.includes('退货') || doc.text.includes('无理由'))) score += 2;
      if (ql.includes('验机') && doc.text.includes('验机')) score += 2;
      if (ql.includes('回收') && doc.text.includes('回收')) score += 2;
      if (ql.includes('流程') && doc.text.includes('流程')) score += 1;
      if (ql.includes('规则') && doc.text.includes('规则')) score += 1;
      if (ql.includes('收费') || ql.includes('费用') || ql.includes('价格')) {
        if (doc.text.includes('费') || doc.text.includes('价格')) score += 1;
      }
      return { doc, score };
    }).filter(x => x.score > 0).sort((a, b) => b.score - a.score);

    if (scored.length === 0) return null;
    const top = scored[0];
    return { answer: top.doc.text, src: top.doc };
  }

  function askQa() {
    const input = $('#qaInput');
    const q = input.value.trim();
    if (!q) return;
    appendQa('user', q, null);
    input.value = '';

    // 模拟打字延迟
    const typing = document.createElement('div');
    typing.className = 'qa-typing';
    typing.innerHTML = '<span class="dot"></span><span class="dot"></span><span class="dot"></span>';
    $('#qaChat').appendChild(typing);
    $('#qaChat').scrollTop = $('#qaChat').scrollHeight;

    setTimeout(() => {
      typing.remove();
      const result = mockRetrieve(q);
      if (result) {
        appendQa('assistant', result.answer, result.src);
      } else {
        appendQa('assistant', '抱歉，我在知识库中没有找到与「' + q + '」相关的内容。你可以换个问法，或询问关于交易规则、验机服务、回收政策等话题。', null);
      }
    }, 600);
  }

  // ===== 导出报告（mock） =====
  function exportReport() {
    const sel = competitors.filter(c => selectedIds.has(c.id));
    const target = sel.length >= 1 ? sel : competitors;
    if (target.length === 0) { toast('暂无可导出的竞品'); return; }
    let md = '# 二手交易平台竞品分析报告\n\n';
    md += '> 生成时间：' + new Date().toLocaleString() + '\n\n';
    md += '## 一、竞品总览\n\n';
    md += '| 名称 | 类型 | 定位 | 总分 |\n|---|---|---|---|\n';
    target.forEach(c => {
      const total = RATING_DIMS.reduce((s, d) => s + (c.score[d] || 0), 0);
      md += `| ${c.name} | ${c.type} | ${c.positioning} | ${total} |\n`;
    });
    md += '\n## 二、评分对比\n\n';
    md += '| 竞品 | ' + RATING_DIMS.join(' | ') + ' | 总分 |\n|---|---|---|---|---|---|---|\n';
    target.forEach(c => {
      const total = RATING_DIMS.reduce((s, d) => s + (c.score[d] || 0), 0);
      md += `| ${c.name} | ` + RATING_DIMS.map(d => c.score[d] || 0).join(' | ') + ` | ${total} |\n`;
    });
    md += '\n## 三、详细档案\n\n';
    target.forEach(c => {
      md += `### ${c.name}（${c.type}）\n\n`;
      md += `- **定位**：${c.positioning}\n`;
      md += `- **官网**：${c.website}\n`;
      md += `- **核心功能**：${c.features}\n`;
      md += `- **目标用户**：${c.targetUsers}\n`;
      md += `- **业务模式**：${c.businessModel}\n`;
      md += `- **定价**：${c.pricing}\n`;
      md += `- **优势**：${c.strengths}\n`;
      md += `- **不足**：${c.weaknesses}\n\n`;
    });

    // 触发浏览器下载
    const blob = new Blob([md], { type: 'text/markdown;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = '竞品分析报告_' + Date.now() + '.md';
    a.click();
    URL.revokeObjectURL(url);
    toast('报告已导出（Markdown）');
  }

  // ===== 事件绑定 =====
  $$('.tab').forEach(t => t.addEventListener('click', () => switchTab(t.dataset.tab)));
  $('#searchInput').addEventListener('input', renderList);
  $('#typeFilter').addEventListener('change', renderList);
  $('#goFormBtn').addEventListener('click', () => { resetForm(); switchTab('form'); });
  $('#cancelFormBtn').addEventListener('click', () => { resetForm(); switchTab('list'); });
  $('#competitorForm').addEventListener('submit', submitForm);
  $('#exportBtn').addEventListener('click', exportReport);

  // 初始化
  updateCompareBadge();
  renderScoreArea(null);
  renderList();
</script>
</body>
</html>
