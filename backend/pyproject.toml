[project]
name = "competitor-analysis-backend"
version = "0.1.0"
description = "二手交易平台分析系统 - 后端"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "PyJWT>=2.8",
    "bcrypt>=4.0",
    "redis>=5.0",
    "alembic>=1.13",
    "beautifulsoup4>=4.12",
    "apscheduler>=3.10",
    # ---- RAG 检索依赖（二手交易知识库问答）----
    "chromadb>=1.5",
    "rank-bm25>=0.2.2",
    "jieba>=0.42",
    "numpy>=2.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "B008", # FastAPI 依赖注入：Query/Depends 必须在参数默认值中调用，属框架惯用写法
    "UP042", # str+Enum 继承：Pydantic 推荐写法，使枚举按字符串序列化
    "E501", # 中文文案行：CJK 字符显示宽度约为 ASCII 两倍，88 字符限制对含中文的行过严
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]
